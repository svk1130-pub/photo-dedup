name: photo-dedup

# Хост-корень с фото: папка, внутри которой лежат src/ (архив) и trash/ (дубликаты).
# Задаётся ОДИН РАЗ здесь (или в .env рядом с compose — см. .env.example); подпапки
# src/trash правятся из UI (Настройки → paths) и в settings.toml, без пересборки.
# Пути в settings.[paths] указываются КАК НА ХОСТЕ: /home/me/myfotos/src и т.п.
x-photos-root: &photos-root ${PHOTOS_ROOT:-./photos}

x-common-env: &common-env
  PG_DSN: postgresql://photo:photo@db:5432/photo
  # Маппинг host→container для [paths] settings.toml:
  #   /home/me/myfotos/src (в настройках) → /photos/src (внутри контейнера)
  PATH_MAP_HOST: ${PHOTOS_ROOT:-./photos}
  PATH_MAP_CONTAINER: /photos

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: photo
      POSTGRES_PASSWORD: photo
      POSTGRES_DB: photo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # только для локальной разработки вне docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # CLI-движок. НЕ автозапускается и не рестартует — используется через:
  #   docker compose run --rm engine run | scan | analyze | move | status | stop
  # …или кнопками «▶️ Запустить run» / «🔍 Запустить scan» на вкладке «Монитор»
  # (кнопки стартуют тот же CLI как subprocess внутри web-контейнера).
  engine:
    build: .
    image: photo-dedup:1.4.0
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *common-env
      SETTINGS_PATH: /app/settings.toml
    volumes:
      # ЕДИНЫЙ rw-маунт корня фото: движку rw (перенос из src в trash);
      # create_host_path: false — явная ошибка вместо молча пустой папки
      - type: bind
        source: *photos-root
        target: /photos
        bind:
          create_host_path: false
      - type: bind
        source: ./settings.toml
        target: /app/settings.toml
        read_only: true          # движок только читает настройки
        bind:
          create_host_path: false   # не создавать каталог вместо забытого файла — сразу ясная ошибка

  # Streamlit: монитор и пульт. С 1.4.0 web имеет rw-доступ к фото — это нужно
  # для кнопок «↩️ Вернуть»/«🗑️ Удалить» в галерее и запуска движка из UI.
  web:
    build: .
    image: photo-dedup:1.4.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["streamlit", "run"]
    command: ["web/app.py", "--server.headless=true", "--server.port=8501", "--browser.gatherUsageStats=false"]
    ports:
      - "9501:8501"
    environment:
      <<: *common-env
      SETTINGS_PATH: /data/settings.toml   # rw-маунт ТЕГО ЖЕ host-файла settings.toml
      THUMBS_DIR: /data/cache/thumbs
    volumes:
      # Тот же единый маунт корня фото, что у engine (rw: возврат/удаление из trash)
      - type: bind
        source: *photos-root
        target: /photos
        bind:
          create_host_path: false
      - type: bind
        source: ./settings.toml
        target: /data/settings.toml   # БЕЗ :ro — UI пишет настройки в тот же host-файл
        bind:
          create_host_path: false
      - thumbs:/data/cache       # дисковый кэш миниатюр (named volume)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3); sys.exit(0 if r.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
  thumbs:
