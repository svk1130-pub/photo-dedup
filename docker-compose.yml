name: photo-dedup

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: photo
      POSTGRES_PASSWORD: photo
      POSTGRES_DB: photo
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"   # только для локальной разработки вне docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo -d photo"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  # CLI-движок. НЕ автозапускается и не рестартует — используется через:
  #   docker compose run --rm engine run | scan | analyze | move | undo | status | stop
  engine:
    build: .
    image: photo-dedup:1.6.1
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_DSN: postgresql://photo:photo@db:5432/photo
      SETTINGS_PATH: /app/settings.toml
      PHOTOS_ROOT: ${PHOTOS_ROOT:-}   # только информативно (журнал/логи)
    volumes:
      # Где лежат фото НА ХОСТЕ — задаёт ОДНА переменная PHOTOS_ROOT в .env
      # (по умолчанию ./ — папки рядом с docker-compose.yml, как раньше).
      # Контейнерный путь всегда один и тот же: /data/src и /data/trash —
      # поэтому [paths] в settings.toml не нужно трогать при переносе архива.
      - ${PHOTOS_ROOT:-.}/src:/data/src        # rw: shutil.move удаляет файл-источник после копии
      - ${PHOTOS_ROOT:-.}/trash:/data/trash    # rw: сюда переносятся дубликаты
      - type: bind
        source: ./settings.toml
        target: /app/settings.toml
        read_only: true          # движок только читает настройки
        bind:
          create_host_path: false   # не создавать каталог вместо забытого файла — сразу ясная ошибка

  # Job-runner (1.5.0 Ф1 + 1.6.0 Ф2): исполнитель очереди заданий jobs в PostgreSQL.
  # UI (кнопки ▶️/🔍/🧠/📦/↩️ на Мониторе) ставит задание (INSERT +
  # pg_notify), runner берёт его атомарно (FOR UPDATE SKIP LOCKED) и выполняет
  # ТОТ ЖЕ код движка in-process — тот же образ/маунты, БЕЗ docker-сокета и
  # subprocess (дизайн: docs/WHY_NO_BUTTONS.md §5, вариант A). Пробуждение —
  # LISTEN/NOTIFY, фоллбэк — опрос раз в RUNNER_POLL_SEC; heartbeat подтверждает
  # живость, зависшие задания помечаются stale на рестарте (crash-recovery).
  # CLI `docker compose run --rm engine …` продолжает работать как раньше.
  runner:
    build: .
    image: photo-dedup:1.6.1
    init: true
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["python", "-m", "engine.runner"]
    environment:
      PG_DSN: postgresql://photo:photo@db:5432/photo
      SETTINGS_PATH: /app/settings.toml
      PHOTOS_ROOT: ${PHOTOS_ROOT:-}   # только информативно (журнал/логи)
      RUNNER_POLL_SEC: ${RUNNER_POLL_SEC:-2}         # фоллбэк-опрос очереди
      RUNNER_HEARTBEAT_SEC: ${RUNNER_HEARTBEAT_SEC:-5}   # метка живости задания
      RUNNER_STALE_SEC: ${RUNNER_STALE_SEC:-30}      # heartbeat истёк → stale (старт runner'а и UI)
      RUNNER_RETAIN_JOBS: ${RUNNER_RETAIN_JOBS:-200} # retention истории очереди (после finish)
    volumes:
      - ${PHOTOS_ROOT:-.}/src:/data/src        # rw: shutil.move, как у engine
      - ${PHOTOS_ROOT:-.}/trash:/data/trash    # rw: сюда переносятся дубликаты
      - type: bind
        source: ./settings.toml
        target: /app/settings.toml
        read_only: true          # runner только читает настройки
        bind:
          create_host_path: false

  # Streamlit: тонкий клиент. Движок как subprocess НЕ запускает; выполняет
  # только точечные файловые операции из engine/webops.py (⭐/📋/↩️/🗑️/undo)
  # по путям из БД — поэтому src/trash смонтированы rw и операции запрещены,
  # пока движок работает (guard в UI).
  # Почему нет кнопки «Запустить движок» через docker-сокет — docs/WHY_NO_BUTTONS.md
  web:
    build: .
    image: photo-dedup:1.6.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["streamlit", "run"]
    command: ["web/app.py", "--server.headless=true", "--server.port=8501", "--browser.gatherUsageStats=false"]
    ports:
      - "9501:8501"              # на хосте — http://localhost:9501 (8501 часто занят)
    environment:
      PG_DSN: postgresql://photo:photo@db:5432/photo
      SETTINGS_PATH: /data/settings.toml   # rw-маунт ТЕГО ЖЕ host-файла settings.toml
      THUMBS_DIR: /data/cache/thumbs
      PHOTOS_ROOT: ${PHOTOS_ROOT:-}        # для отображения хост-путей в сайдбаре
      RUNNER_STALE_SEC: ${RUNNER_STALE_SEC:-30}   # Ф2: порог stale-детекции из UI (как у runner'а)
      DOCS_DIR: /app/docs
    volumes:
      - ${PHOTOS_ROOT:-.}/src:/data/src        # rw: точечные операции webops (⭐/↩️)
      - ${PHOTOS_ROOT:-.}/trash:/data/trash    # rw: 📋/🗑️/undo из UI
      - type: bind
        source: ./settings.toml
        target: /data/settings.toml   # БЕЗ :ro — UI пишет настройки в тот же host-файл
        bind:
          create_host_path: false
      - ./docs:/app/docs:ro          # вкладка «Логика» читает LOGIC.md (можно править без пересборки)
      - thumbs:/data/cache           # дисковый кэш миниатюр (named volume)
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; r=urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3); sys.exit(0 if r.status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

volumes:
  pgdata:
  thumbs:
